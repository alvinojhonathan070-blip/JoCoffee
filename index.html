<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Jo Coffee</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-inherit font-montserrat">

  <!-- HERO SECTION -->
  <section id="home" class="bg-[#0B38A9] w-full h-dvh flex flex-col items-center overflow-hidden">
  
  <!-- HIDDEN NAVBAR MOBILE -->
 <div id="hiddenNav" class="left-0 opacity-0 pointer-events-none transition-all duration-300 ease-in-out absolute bg-white pl-4 pt-5 gap-3 flex flex-col z-20 h-full w-[75%]">
  <input 
      type="text" 
      placeholder="Search..." 
      class="w-[90%] bg-gray-50 text-sm text-gray-800 rounded-lg pl-3 pr-9 py-2 border border-gray-200 focus:outline-none focus:border-black transition-colors">
  <ul class="flex text-md flex-col gap-2">
    <li>
      <a class="flex items-center gap-2" href="#home">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house preview-icon"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <span>Home</span>
        </svg>
      </a>
    </li>
    
    <li>
      <a class="flex gap-2 items-center" href="#about">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info preview-icon"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
        <span>About</span>
        </svg>
      </a>
    </li>

    <li>
    <a class="flex gap-2 items-center" href="#menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-coffee preview-icon"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/>
      <span>Menu</span>
      </svg>
    </a>
    </li>

  <li><a class="flex gap-2 items-center" href="#location">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin preview-icon"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>
    <span>Location</span>
    </svg>
    </a>
  </li>
  </ul>
  </div>
  
    <!-- NAVBAR -->
<nav id="navbar" class="fixed w-full px-3 flex flex-row justify-between items-center z-5 "> 
  <img src="images/LOGO JOCOFFEE.webp" fetchpriority="high" alt="Jo Coffee Logo" class="h-24 object-contain">
  
<button 
  id="btnNav" 
  aria-label="Open Menu" 
  class="group p-2 active:scale-110 transition focus:outline-none"
>
  <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Garis Atas -->
    <path 
      d="M4 6h16" 
      class="transition-all duration-300 origin-center group-[.active]:rotate-45 group-[.active]:translate-y-[6px]" 
    />
    
    <!-- Garis Tengah -->
    <path 
      d="M4 12h16" 
      class="transition-all duration-300 group-[.active]:opacity-0" 
    />
    
    <!-- Garis Bawah -->
    <path 
      d="M4 18h16" 
      class="transition-all duration-300 origin-center group-[.active]:-rotate-45 group-[.active]:-translate-y-[3px]" 
    />
  </svg>
</button>

</nav>

    <!-- MAIN HERO CONTENT -->
    <h1 class="mt-[25%] text-white text-[34px] text-nowrap font-semibold text-center">
      It's More Than Coffee
    </h1>

    <!-- CARD & IMAGE CONTAINER -->
    <div class="h-[65%] pb-[3%] mt-auto gap-5 bg-white rounded-t-3xl border-t-4 border-l-4 border-r-4 border-[#030712] w-[90%] flex flex-col items-center relative">

      <!-- Coffee Image with Hover Transition -->
      <img 
        src="images/KOPI (1).webp" 
        fetchpriority="high" 
        alt="Jo Coffee Cup"
        class="-mt-[15%] h-[95%] w-auto object-contain active:scale-110 transition-transform duration-300 drop-shadow-2xl"
      >

      <!-- CTA Button -->
      <a href="#about" class="pt-0.5 h-10 text-black font-semibold w-[45%] flex justify-center items-center rounded-xl transition bg-white backdrop-blur-3xl active:scale-90 active:bg-yellow-400 border-0 shadow-[inset_0_2px_3px_rgba(0,0,0,0.4),0_3px_10px_rgba(0,0,0,0.5)]">
        Discover More!
      </a>
    </div>

  </section>

  <!-- NEXT SECTION -->
  <section id="about" class="bg-white w-full min-h-dvh px-6 py-12 text-white">
    <!-- Konten section berikutnya -->
  </section>
<script src="script.js"></script>
</body>
</html>
